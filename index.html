<!doctype html>
<html lang="en">
<head>

  <meta name="theme-color" content="#111c33" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="./styles.css" />
  <title>Revision Flow</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard" aria-label="Revision Flow home"><span class="brand-mark">✳</span><span class="brand-text">revision<span class="brand-accent">flow</span><small>YOUR STUDY SYSTEM</small></span></a>
      <div class="nav-title">WORKSPACE</div>
      <nav class="desktop-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="timetable"><span class="nav-icon">▦</span>Timetable</button>
        <button class="nav-item" data-view="topics"><span class="nav-icon">◎</span>Topic mastery</button>
        <button class="nav-item" data-view="insights"><span class="nav-icon">▥</span>Insights</button>
        <button class="nav-item" data-view="bridge"><span class="nav-icon">✳</span>ChatGPT bridge</button>

    </div>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button data-view="dashboard" class="active"><span>◫</span>Home</button>
    <button data-view="timetable"><span>▦</span>Plan</button>
    <button data-view="topics"><span>◎</span>Topics</button>
    <button data-view="bridge"><span>✳</span>AI sync</button>
    <button data-view="settings"><span>⚙</span>More</button>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
